# The TLC runs ADR 0003's checked model owes (plan M0), read by
# scripts/model-check.py through `just model-check-0003`.
#
# expect = "pass": TLC explores the whole bounded state space with no violation.
# expect = "<Name>": TLC must stop on a violation of exactly <Name>. Two kinds:
#   * a MUTANT (MUTANT = "<mutant>"): the RED half. The invariant is not vacuous,
#     and the mechanism the mutant removes is the one it rests on.
#   * a FINDING (MUTANT = "none"): the ADR as written, at the constants named, breaks
#     a property it claims. Each is reported against the ADR; the check pins the
#     counterexample until the ADR or the model changes.
# A mutant or finding check runs only the invariant it names. A finding carries its
# id (`finding`), the one the M0 report and the models' README use.

# ─── LeaseOrder: §4 node session, provider-owned kill, settlement order ───────

[spec.LeaseOrder]
file = "LeaseOrder.tla"
invariants = [
    "TypeOK",
    "NoCapsuleAfterSettlement",
    "NoDoubleDelivery",
    "NotPerformedIsSound",
    "PastGKeepsReportedOutcome",
    "NoMarkOnClosedSliceOrRevokedNode",
    "NoMarkAfterRevokeCommitted",
]
properties = ["VerdictsOnlyForward"]
typing = ["TypeOK"]
refuted = ["NoMarkAfterRevokeCommitted"]

# Exact clocks (rho = 0): L = 3, K = 1 (the provider, D to an empty subtree),
# K_CONTAIN = 1 (a live node's kill_and_contain after a provider death),
# SLACK = 2, so W = L + K + SLACK = 6 real units.
[spec.LeaseOrder.constants]
Nodes = "{n1}"
MaxAttempts = 1
MaxInc = 2
L = 3
K = 1
K_CONTAIN = 1
SLACK = 2
RHO_NUM = 0
RHO_DEN = 1
T_RENEW = 1
G_WAIT = 2
HARNESS_IN_NODE = true
Kinds = '{"shell", "embedded"}'
ALLOW_STALL = false
ALLOW_CRASH = false
ALLOW_PROVIDER_DEATH = false
ALLOW_CONTROL_RESTART = false
ALLOW_REVOKE = false
ALLOW_GATEWAY_DOWN = false
ALLOW_NODE_WIPE = false
ALLOW_SUSPEND = false
ALLOW_PARTITION = false
MaxFaults = 2
EXCUSE_CRASHED = true
MUTANT = "none"

[[check]]
name = "lease-order-node-faults"
spec = "LeaseOrder"
expect = "pass"
[check.constants]
ALLOW_STALL = true
ALLOW_CRASH = true
ALLOW_PROVIDER_DEATH = true
ALLOW_NODE_WIPE = true
ALLOW_SUSPEND = true
ALLOW_PARTITION = true

[[check]]
name = "lease-order-control-restart"
spec = "LeaseOrder"
expect = "pass"
[check.constants]
ALLOW_CONTROL_RESTART = true
ALLOW_STALL = true
ALLOW_PARTITION = true

[[check]]
name = "lease-order-revoke-gateway"
spec = "LeaseOrder"
expect = "pass"
[check.constants]
ALLOW_REVOKE = true
ALLOW_GATEWAY_DOWN = true
ALLOW_STALL = true
ALLOW_PARTITION = true

# After S4 the turn runs in the capsule: the only requester is the capsule.
[[check]]
name = "lease-order-capsule-harness"
spec = "LeaseOrder"
expect = "pass"
[check.constants]
HARNESS_IN_NODE = false
ALLOW_STALL = true
ALLOW_CRASH = true
ALLOW_PROVIDER_DEATH = true
ALLOW_PARTITION = true

# Two attempts of the retry chain: a re-run only after PROVEN NOT PERFORMED, never
# beside its predecessor's capsule.
[[check]]
name = "lease-order-retry-chain"
spec = "LeaseOrder"
expect = "pass"
[check.constants]
MaxAttempts = 2
MaxFaults = 1
ALLOW_STALL = true
ALLOW_CRASH = true
ALLOW_PARTITION = true
ALLOW_GATEWAY_DOWN = true

# Every one of the nine faults, any two of them.
[[check]]
name = "lease-order-fault-pairs"
spec = "LeaseOrder"
expect = "pass"
[check.constants]
ALLOW_STALL = true
ALLOW_CRASH = true
ALLOW_PROVIDER_DEATH = true
ALLOW_CONTROL_RESTART = true
ALLOW_REVOKE = true
ALLOW_GATEWAY_DOWN = true
ALLOW_NODE_WIPE = true
ALLOW_SUSPEND = true
ALLOW_PARTITION = true

# Two nodes beside the two-attempt retry chain: a re-run landing on the other node
# while the first is partitioned, stalled or crashed, or while kata-control restarts.
# Shell attempts only, one incarnation per node, one fault: the nodes are permuted
# (SYMMETRY), and every invariant is unchanged by renaming them.
[[check]]
name = "lease-order-two-nodes"
spec = "LeaseOrder"
expect = "pass"
symmetry = "Symmetry"
[check.constants]
Nodes = "{n1, n2}"
MaxAttempts = 2
MaxInc = 1
Kinds = '{"shell"}'
HARNESS_IN_NODE = false
MaxFaults = 1
ALLOW_STALL = true
ALLOW_CRASH = true
ALLOW_CONTROL_RESTART = true
ALLOW_PARTITION = true

# Two nodes and a second incarnation each: a node that crashed, or lost its lease
# behind a partition, says Hello again and its intake settles the attempt, the re-run
# landing on either node. L = 2 keeps the space finite enough to finish.
[[check]]
name = "lease-order-two-nodes-rejoin"
spec = "LeaseOrder"
expect = "pass"
symmetry = "Symmetry"
[check.constants]
Nodes = "{n1, n2}"
MaxAttempts = 2
MaxInc = 2
L = 2
Kinds = '{"shell"}'
HARNESS_IN_NODE = false
MaxFaults = 1
ALLOW_CRASH = true
ALLOW_PARTITION = true

# Drifting clocks, rho = 1/10 per clock against real time: L = 5 measures 4..6 real
# units on the node's clock; W = ceil(5 * 1.1) + 1 + 2 = 9 cannot end before 8 real
# units on kata-control's. Mutant w_without_rho drops the drift term at these bounds.
[[check]]
name = "lease-order-drift"
spec = "LeaseOrder"
expect = "pass"
[check.constants]
L = 5
RHO_NUM = 1
RHO_DEN = 10
T_RENEW = 2
MaxFaults = 1
ALLOW_STALL = true
ALLOW_PARTITION = true

# Drift with provider death needs SLACK = 3. At SLACK = 2 a provider dying at its own
# kill hands the capsule to kill_and_contain (K_CONTAIN = 1), which ends on the very
# integer instant W does: F1's class, made a tie by the widening (L rounds up to 6 real
# units, W down to 8). In dense time the capsule is gone at 7.56, before W's 7.73;
# the third unit is that rounding margin, not a design margin.
[[check]]
name = "lease-order-drift-provider-death"
spec = "LeaseOrder"
expect = "pass"
[check.constants]
L = 5
SLACK = 3
RHO_NUM = 1
RHO_DEN = 10
T_RENEW = 2
MaxFaults = 1
ALLOW_STALL = true
ALLOW_PROVIDER_DEATH = true
ALLOW_PARTITION = true

# FINDING F1. ADR §4 pins K (the provider's D-to-empty-subtree) below the slack and
# claims the order "against ... a provider that dies under a live node". A provider
# that dies just before its own kill hands the capsule to the node's kill_and_contain,
# whose latency no term of W covers: with K = 1 < SLACK = 2 as the ADR requires and
# K_CONTAIN = 4, a capsule outlives its settlement (also in dense time: the provider
# may die strictly before D and the node's containment still ends after W).
[[check]]
name = "lease-order-finding-containment-outside-w"
spec = "LeaseOrder"
expect = "NoCapsuleAfterSettlement"
finding = "F1"
invariants = ["NoCapsuleAfterSettlement"]
properties = []
[check.constants]
K_CONTAIN = 4
MaxFaults = 1
ALLOW_PROVIDER_DEATH = true

# FINDING F7. ADR §4 names one double fault, "a dead provider under a stalled node".
# A dead provider under a CRASHED node has no kill path either (no provider at D, no
# node to contain it; under systemd the unit's stop sends SIGTERM, which the capsule's
# PID-namespace init ignores until TimeoutStopSec), so the order holds only with that
# case named as well (EXCUSE_CRASHED = true in every passing check).
[[check]]
name = "lease-order-finding-dead-provider-under-crashed-node"
spec = "LeaseOrder"
expect = "NoCapsuleAfterSettlement"
finding = "F7"
invariants = ["NoCapsuleAfterSettlement"]
properties = []
[check.constants]
EXCUSE_CRASHED = false
ALLOW_CRASH = true
ALLOW_PROVIDER_DEATH = true

# FINDING F4, at the gateway. ADR §3: "`kata node revoke` commits `revoked` first; from
# then on ... the gateway refuses the node's requests". The gateway learns a revocation
# over its session with kata-control, after the commit, and the command reports
# success at the commit: until the gateway's mirror holds it (while that session is
# down, up to the open slices' grants and deadlines), the revoked node's requests are
# marked and forwarded on its open slices. With F4's correction (report once the mirror holds it) no mark follows the
# report: NoMarkOnClosedSliceOrRevokedNode, read on the mirror, holds.
[[check]]
name = "lease-order-finding-mark-after-revoke-commit"
spec = "LeaseOrder"
expect = "NoMarkAfterRevokeCommitted"
finding = "F4"
invariants = ["NoMarkAfterRevokeCommitted"]
properties = []
[check.constants]
MaxFaults = 1
ALLOW_REVOKE = true

