# ─── SliceBudget: §5 escrowed slices, marks, SliceRevoke/SliceClosed, G ───────

[spec.SliceBudget]
file = "SliceBudget.tla"
invariants = [
    "NoForwardPastTheBound",
    "SpendWithinBoundPlusInFlight",
    "NoReissue",
    "NoForwardWithoutMark",
    "NotPerformedIsSound",
    "PastGAmbiguousOnlyUnreported",
    "ChargeNeverZeroForUnknown",
    "AdoptionComplete",
    "NewSliceAfterOwedRevokes",
    "NoMarkOnClosedSlice",
]
properties = ["NoRefillWhenFrozen"]
refuted = ["NoForwardPastTheBound"]

# Two sibling attempts in one token-bounded scope: B = 2, grants and refills of
# CHUNK = 1, one request's usage up to UMAX = 2 (it may overshoot its grant).
[spec.SliceBudget.constants]
Attempts = "{1, 2}"
MaxReq = 2
BOUNDED = true
B = 2
CHUNK = 1
UMAX = 2
MaxMarks = 3
HARNESS_RETRIES = false
ALLOW_GW_CRASH = false
ALLOW_GW_LOSS = false
ALLOW_LINK_LOSS = false
ALLOW_CTL_CRASH = false
MaxFaults = 1
MUTANT = "none"

# Every invariant but the bound's literal claim, which FINDING F2 refutes, over three
# marks and one fault: a gateway crash, a lost session or a kata-control crash (a lost
# gateway journal needs the crash first: two faults, the next check).
[[check]]
name = "slice-budget-faults"
spec = "SliceBudget"
expect = "pass"
invariants = [
    "SpendWithinBoundPlusInFlight",
    "NoReissue",
    "NoForwardWithoutMark",
    "NotPerformedIsSound",
    "PastGAmbiguousOnlyUnreported",
    "ChargeNeverZeroForUnknown",
    "AdoptionComplete",
    "NewSliceAfterOwedRevokes",
    "NoMarkOnClosedSlice",
]
[check.constants]
ALLOW_GW_CRASH = true
ALLOW_GW_LOSS = true
ALLOW_LINK_LOSS = true
ALLOW_CTL_CRASH = true

# Any two of the four faults over two marks: a lost gateway journal (the crash that
# stops the gateway, then the loss), and every other pair.
[[check]]
name = "slice-budget-fault-pairs"
spec = "SliceBudget"
expect = "pass"
invariants = [
    "SpendWithinBoundPlusInFlight",
    "NoReissue",
    "NoForwardWithoutMark",
    "NotPerformedIsSound",
    "PastGAmbiguousOnlyUnreported",
    "ChargeNeverZeroForUnknown",
    "AdoptionComplete",
    "NewSliceAfterOwedRevokes",
    "NoMarkOnClosedSlice",
]
[check.constants]
MaxMarks = 2
MaxFaults = 2
ALLOW_GW_CRASH = true
ALLOW_GW_LOSS = true
ALLOW_LINK_LOSS = true
ALLOW_CTL_CRASH = true

# One attempt refilled across its whole bound.
[[check]]
name = "slice-budget-refills"
spec = "SliceBudget"
expect = "pass"
invariants = ["SpendWithinBoundPlusInFlight", "NoReissue", "NotPerformedIsSound"]
[check.constants]
Attempts = "{1}"
MaxReq = 3
MaxMarks = 4
ALLOW_LINK_LOSS = true

# time_bound alone, with nanocode's retry layers off.
[[check]]
name = "slice-budget-time-bound"
spec = "SliceBudget"
expect = "pass"
invariants = [
    "NoReissue",
    "NoForwardWithoutMark",
    "NotPerformedIsSound",
    "PastGAmbiguousOnlyUnreported",
    "ChargeNeverZeroForUnknown",
    "AdoptionComplete",
    "NewSliceAfterOwedRevokes",
    "NoMarkOnClosedSlice",
]
properties = []
[check.constants]
BOUNDED = false
MaxMarks = 2
ALLOW_GW_CRASH = true
ALLOW_LINK_LOSS = true

# FINDING F2. ADR §5: "no request is forwarded in a bounded scope once its grants
# are spent by known usage ...; overshoot is at most the usage of requests in flight
# at the crossing". The gateway checks each slice's own grant, so after one sibling's
# request overshoots and the scope's known usage reaches its bound, another sibling
# still holds escrowed grant and is forwarded.
[[check]]
name = "slice-budget-finding-sibling-overshoot"
spec = "SliceBudget"
expect = "NoForwardPastTheBound"
finding = "F2"
invariants = ["NoForwardPastTheBound"]
properties = []

# FINDING F3. ADR §1 and §5: a model request is never re-issued; "nothing that may
# have been processed is re-issued". kata runs nanocode's own retry layers (Responses:
# `ResponsesRetryPolicy`'s default 5 tries; Messages: 5, or 3 without tools, fixed in
# the backend, beyond any `max_attempts`), which re-send a request whose stream failed
# before a response reached the harness. Under time_bound alone (no Unknown freeze) a
# request that failed so (Unknown{delivered = false}, or Unknown{gateway_lost} after a
# gateway crash: either may have been processed) is sent again by the harness, through
# the gateway, under a new mark. The fix is at kata's host transport and the gateway,
# on both backends: every Unknown reaches the harness as `x-should-retry: false`.
[[check]]
name = "slice-budget-finding-harness-retries"
spec = "SliceBudget"
expect = "NoReissue"
finding = "F3"
invariants = ["NoReissue"]
properties = []
[check.constants]
BOUNDED = false
HARNESS_RETRIES = true
MaxMarks = 2

