invariants = ["RevokedNeverWelcomed"]
[check.constants]
MUTANT = "keep_keys_without_mirror"
MaxFaults = 1
ALLOW_SERVER_LOSS = true

# The server is lost, the no-mirror restore drops every key, its data is lost before a
# backup of it ships, and the next restore reuses the older backup. Had the drop left
# the sequence where it was, the new gateway's mirror ("no keys") would not be newer
# than that backup, whose admitted set still holds the revoked key.
[[check]]
name = "restore-mutant-drop-without-seq-bump"
spec = "Restore"
expect = "RevokedNeverWelcomed"
invariants = ["RevokedNeverWelcomed"]
[check.constants]
MUTANT = "drop_without_seq_bump"
WORK = false
ALLOW_SERVER_LOSS = true
ALLOW_DATA_LOSS = true

[[check]]
name = "restore-mutant-no-hold"
spec = "Restore"
expect = "NoRepeatWithoutOperator"
invariants = ["NoRepeatWithoutOperator"]
[check.constants]
MUTANT = "no_hold"
MaxFaults = 1
ALLOW_DATA_LOSS = true

[[check]]
name = "restore-mutant-no-schedule-hold"
spec = "Restore"
expect = "NoRepeatWithoutOperator"
invariants = ["NoRepeatWithoutOperator"]
[check.constants]
MUTANT = "no_schedule_hold"
MaxFaults = 1
ALLOW_DATA_LOSS = true

[[check]]
name = "restore-mutant-restore-settles-at-boot"
spec = "Restore"
expect = "NoCapsuleAfterSettlement"
invariants = ["NoCapsuleAfterSettlement"]
[check.constants]
MUTANT = "restore_settles_at_boot"
MaxFaults = 1
ALLOW_DATA_LOSS = true

[[check]]
name = "restore-mutant-resume-across-restore"
spec = "Restore"
expect = "NoCapsuleAfterSettlement"
invariants = ["NoCapsuleAfterSettlement"]
[check.constants]
Keys = "{}"
MUTANT = "resume_across_restore"
MaxFaults = 1
ALLOW_DATA_LOSS = true

# ─── FenceExemption: plan M0's question on fence_inbound_attempt_frame ────────

[spec.FenceExemption]
file = "FenceExemption.tla"
invariants = ["NoForeignFrameAccepted", "NoGenuineTerminalRefused"]
properties = []

[spec.FenceExemption.constants]
Nodes = "{n1, n2}"
MaxEpoch = 2
PLACE_IN_DISPATCH = true
EXEMPTION = false
MUTANT = "none"

# THE ANSWER: with the placement committed in the dispatch transaction (ADR 0003) and
# the exemption deleted, no genuine terminal is refused and no foreign frame accepted.
[[check]]
name = "fence-placement-in-dispatch"
spec = "FenceExemption"
expect = "pass"

# Keeping the exemption after placement-in-dispatch is a hole: an attempt is NULL-placed
# only before its first dispatch and while parked, and any admitted node's frame at the
# parked attempt's epoch passes.
[[check]]
name = "fence-finding-exemption-kept"
spec = "FenceExemption"
expect = "NoForeignFrameAccepted"
finding = "F8"
invariants = ["NoForeignFrameAccepted"]
[check.constants]
EXEMPTION = true

# Today's split (placement written after the dispatch commit) with the exemption: no
# genuine terminal is refused, at the residual the ingress fence's comment states.
[[check]]
name = "fence-today"
spec = "FenceExemption"
expect = "pass"
invariants = ["NoGenuineTerminalRefused"]
[check.constants]
PLACE_IN_DISPATCH = false
EXEMPTION = true

[[check]]
name = "fence-today-residual"
spec = "FenceExemption"
expect = "NoForeignFrameAccepted"
finding = "R1"
invariants = ["NoForeignFrameAccepted"]
[check.constants]
PLACE_IN_DISPATCH = false
EXEMPTION = true

# RED: today's split refusing an unplaced attempt's frame wedges a genuine terminal,
# which is why the exemption exists until placement-in-dispatch lands.
[[check]]
name = "fence-mutant-refuse-unplaced"
spec = "FenceExemption"
expect = "NoGenuineTerminalRefused"
invariants = ["NoGenuineTerminalRefused"]
[check.constants]
PLACE_IN_DISPATCH = false
EXEMPTION = true
MUTANT = "refuse_unplaced"

[[check]]
name = "fence-mutant-no-placement-check"
spec = "FenceExemption"
expect = "NoForeignFrameAccepted"
invariants = ["NoForeignFrameAccepted"]
[check.constants]
MUTANT = "no_placement_check"

[[check]]
name = "restore-mutant-orphan-never-killed"
spec = "Restore"
expect = "OneCapsulePerStage"
invariants = ["OneCapsulePerStage"]
[check.constants]
Keys = "{}"
MUTANT = "orphan_never_killed"
MaxFaults = 1
ALLOW_DATA_LOSS = true

# ─── ForgeIntent: "Effects" and E1, forge intents behind a pre-intent read ─────

[spec.ForgeIntent]
file = "ForgeIntent.tla"
invariants = [
    "NoWireEffectWithoutIntent",
    "NoPushOverUnreadHead",
    "NoPushWithoutVerdict",
    "OnePullRequest",
    "ObserverVerdictSound",
    "NotPerformedIsSound",
    "NoUnclassifiedBeforeTheBound",
    "NoAskPastTheBound",
    "BeyondBoundSettlesAtOnce",
]
properties = []

[spec.ForgeIntent.constants]
MaxFaults = 3
MaxAsks = 2
EXCUSE_ABA = true
MUTANT = "none"

[[check]]
name = "forge-intent"
spec = "ForgeIntent"
expect = "pass"

# FINDING F9. The push's observer is the remote ref (ADR "Effects"). If, after kata's
# push and before its observer's first answered read, the branch is back on the very
# head kata leased on (moved back by any path, or deleted when kata found it absent),
# the ref reads as the lease: NOT PERFORMED, and the push is sent again (CI and
# webhooks act twice). No ref-only observer can tell; the ADR states it beside the
# marker residual for pull requests. Unanswered reads do not close the window, so a
# read error's bounded re-ask keeps it open while the remote is down.
[[check]]
name = "forge-intent-finding-aba"
spec = "ForgeIntent"
expect = "ObserverVerdictSound"
finding = "F9"
invariants = ["ObserverVerdictSound"]
[check.constants]
EXCUSE_ABA = false

[[check]]
name = "forge-intent-mutant-no-pre-intent-read"
spec = "ForgeIntent"
expect = "NoPushOverUnreadHead"
invariants = ["NoPushOverUnreadHead"]
[check.constants]
MUTANT = "no_pre_intent_read"

[[check]]
name = "forge-intent-mutant-intent-after-push"
spec = "ForgeIntent"
expect = "NoWireEffectWithoutIntent"
invariants = ["NoWireEffectWithoutIntent"]
[check.constants]
MUTANT = "intent_after_push"

[[check]]
name = "forge-intent-mutant-open-prs-only"
spec = "ForgeIntent"
expect = "OnePullRequest"
invariants = ["OnePullRequest"]
[check.constants]
MUTANT = "open_prs_only"

[[check]]
name = "forge-intent-mutant-redo-without-verdict"
spec = "ForgeIntent"
expect = "NoPushWithoutVerdict"
invariants = ["NoPushWithoutVerdict"]
[check.constants]
MUTANT = "redo_without_verdict"

[[check]]
name = "forge-intent-mutant-naive-push-observer"
spec = "ForgeIntent"
expect = "ObserverVerdictSound"
invariants = ["ObserverVerdictSound"]
[check.constants]
MUTANT = "naive_push_observer"

[[check]]
name = "forge-intent-mutant-unreachable-is-not-performed"
spec = "ForgeIntent"
expect = "NotPerformedIsSound"
invariants = ["NotPerformedIsSound"]
[check.constants]
MUTANT = "unreachable_is_not_performed"

# The read-error semantics (owner decision #15): an unanswered read leaves the intent
# open, the MaxAsks-th settles it UNCLASSIFIED. The mutant is the code before it: the
# first unanswered read settled UNCLASSIFIED.
[[check]]
name = "forge-intent-mutant-unread-is-unclassified"
spec = "ForgeIntent"
expect = "NoUnclassifiedBeforeTheBound"
invariants = ["NoUnclassifiedBeforeTheBound"]
[check.constants]
MUTANT = "unread_is_unclassified"

[[check]]
name = "forge-intent-mutant-unbounded-reask"
spec = "ForgeIntent"
expect = "NoAskPastTheBound"
invariants = ["NoAskPastTheBound"]
[check.constants]
MUTANT = "unbounded_reask"

# The count and its settlement are two transactions; a crash between them leaves an
# intent at the bound, open. The drive's pre-check settles it without asking; without
# that check the next drive asks it again.
[[check]]
name = "forge-intent-mutant-ask-at-bound"
spec = "ForgeIntent"
expect = "NoAskPastTheBound"
invariants = ["NoAskPastTheBound"]
[check.constants]
MUTANT = "ask_at_bound"

# A marker listing that reaches its bound is an answer that rules nothing out:
# UNCLASSIFIED at once, never counted as a read the forge did not answer.
[[check]]
name = "forge-intent-mutant-beyond-bound-unanswered"
spec = "ForgeIntent"
expect = "BeyondBoundSettlesAtOnce"
invariants = ["BeyondBoundSettlesAtOnce"]
[check.constants]
MUTANT = "beyond_bound_unanswered"

# A contradicting state asked again, as if unread, lets the branch come back to the
# lease after an answered read, outside F9's window: NOT PERFORMED of a landed push.
[[check]]
name = "forge-intent-mutant-contradiction-reasked"
spec = "ForgeIntent"
expect = "ObserverVerdictSound"
invariants = ["ObserverVerdictSound"]
[check.constants]
MUTANT = "contradiction_reasked"

# The lookup before the pull request's intent adopts an open pull request whose marker
# was deleted; without it (or reading an unanswered lookup as "none open") a second
# pull request opens beside it.
[[check]]
name = "forge-intent-mutant-no-pr-lookup"
spec = "ForgeIntent"
expect = "OnePullRequest"
invariants = ["OnePullRequest"]
[check.constants]
MUTANT = "no_pr_lookup"

[[check]]
name = "forge-intent-mutant-unread-lookup-is-none"
spec = "ForgeIntent"
expect = "OnePullRequest"
invariants = ["OnePullRequest"]
[check.constants]
MUTANT = "unread_lookup_is_none"
