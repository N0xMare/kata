# ─── Restore: §2 identity, generations, revocation mirror; §10 restore ─────────

[spec.Restore]
file = "Restore.tla"
invariants = [
    "RevokedNeverWelcomed",
    "NoRepeatWithoutOperator",
    "NoCapsuleAfterSettlement",
    "OneCapsulePerStage",
]
properties = []

# LK = L + K = 2, W = 3 (> LK).
[spec.Restore.constants]
Keys = "{k1, k2}"
LK = 2
W = 3
REVOKE_ACK = "mirror"
WRITES_WAIT = true
RESUME_AFTER_W = true
WORK = true
ALLOW_SERVER_LOSS = false
ALLOW_DATA_LOSS = false
ALLOW_LINK_LOSS = false
MaxFaults = 2
MUTANT = "none"

# The ADR with corrections F4, F5 and F6 applied: a revocation reported only once the
# gateway's mirror holds it, admission writes held until the gateway answers a restored
# registry, every dispatch of a restored control plane held until W from boot.
# Admission and work are independent halves of the model, each checked against every
# fault, two of them (two restores: a server loss, then a data loss, included).
[[check]]
name = "restore-corrected-admission"
spec = "Restore"
expect = "pass"
invariants = ["RevokedNeverWelcomed"]
[check.constants]
WORK = false
ALLOW_SERVER_LOSS = true
ALLOW_DATA_LOSS = true
ALLOW_LINK_LOSS = true

[[check]]
name = "restore-corrected-work"
spec = "Restore"
expect = "pass"
invariants = ["NoRepeatWithoutOperator", "NoCapsuleAfterSettlement", "OneCapsulePerStage"]
[check.constants]
Keys = "{}"
ALLOW_SERVER_LOSS = true
ALLOW_DATA_LOSS = true
ALLOW_LINK_LOSS = true

# The ADR as written: the claims that hold without the corrections. They rest on two
# mechanisms the ADR does not state (the README's assumptions): restored attempts
# settle only after W from boot (mutant restore_settles_at_boot), and an older
# generation's capsule gets no further grant (mutant resume_across_restore).
[[check]]
name = "restore-as-written"
spec = "Restore"
expect = "pass"
invariants = ["NoRepeatWithoutOperator", "NoCapsuleAfterSettlement"]
[check.constants]
Keys = "{}"
REVOKE_ACK = "commit"
WRITES_WAIT = false
RESUME_AFTER_W = false
ALLOW_SERVER_LOSS = true
ALLOW_DATA_LOSS = true
ALLOW_LINK_LOSS = true

# FINDING F4. ADR §2, decision 7: "Revocations do not roll back". `kata node
# revoke` commits `revoked` in admission.db and reports success; the gateway's mirror
# learns it over its session later. kata-control's data directory is lost before the
# mirror (or a shipped backup) holds it; the restore adopts a mirror that lacks it,
# and the revoked key is welcomed.
[[check]]
name = "restore-finding-revocation-rolled-back"
spec = "Restore"
expect = "RevokedNeverWelcomed"
finding = "F4"
invariants = ["RevokedNeverWelcomed"]
[check.constants]
REVOKE_ACK = "commit"
WRITES_WAIT = false
MaxFaults = 1
ALLOW_DATA_LOSS = true

# FINDING F6. The restored registry adopts the mirror by comparing sequence numbers
# (ADR §2), with every revocation acknowledged only once the mirror holds it. Only
# Hello waits for the gateway's answer: an admission written after the restore (a
# join) advances the restored sequence to the mirror's, the mirror is not "newer", its
# revocation is not adopted, and the revoked key is welcomed.
[[check]]
name = "restore-finding-sequence-adoption-write"
spec = "Restore"
expect = "RevokedNeverWelcomed"
finding = "F6"
invariants = ["RevokedNeverWelcomed"]
[check.constants]
WRITES_WAIT = false
WORK = false
MaxFaults = 1
ALLOW_DATA_LOSS = true

# FINDING F5. ADR §10 holds every execution open at the backup's point for the
# operator, but nothing holds the operator's resume until W from boot: a stage the
# backup does not know is still running in a capsule its old lease keeps alive, and
# the resume dispatches the stage again beside it.
[[check]]
name = "restore-finding-resume-beside-orphan"
spec = "Restore"
expect = "OneCapsulePerStage"
finding = "F5"
invariants = ["OneCapsulePerStage"]
[check.constants]
RESUME_AFTER_W = false
MaxFaults = 1
ALLOW_DATA_LOSS = true

# ─── Restore mutants (RED), on the corrected model ────────────────────────────

[[check]]
name = "restore-mutant-no-mirror-adopt"
spec = "Restore"
expect = "RevokedNeverWelcomed"
invariants = ["RevokedNeverWelcomed"]
[check.constants]
MUTANT = "no_mirror_adopt"
