# cargo-deny config. Format updated for cargo-deny 0.19+.
#
# `just deny` GATES: the L1 commit tier (`_gate-commit-core` in the justfile) runs
# it against whatever advisory database this host last fetched, and the L2 nightly
# runs `just deny-fresh`, the same check against a database fetched that night. An
# advisory published upstream can therefore red a gate on a diff that did not cause
# it; the answer is a lockfile upgrade when one exists, else an ignore below WITH A
# REASON — never removing the step.

[advisories]
version = 2
# Vulnerabilities + unsoundness with an available fix are hard-deny and are
# kept clear by lockfile upgrades (rustls-webpki >=0.103.13 for
# RUSTSEC-2026-0098/0099/0104; anyhow >=1.0.103 for RUSTSEC-2026-0190;
# ctutils >=0.4.4 for its non-constant-time masks, RustCrypto/utils#1569,
# reached by re-pinning commonware in Cargo.toml; crypto-bigint >=0.7.6 for
# RUSTSEC-2026-0387 (0.7.0 to 0.7.8 are all yanked; 0.7.9 is the floor to pin).
# Measure reachability the way the shipped build resolves features: `--workspace`
# (the justfile's `build` and the flake's cargoBuildFlags), with
# `cargo tree --workspace -e normal,features -i <crate>`. A `-p` resolve misses
# what workspace feature unification turns on. Measured that way at nanocode
# 8ec3b215, ctutils links into no shipped binary: its normal paths end at
# kata-test-seeded, which only dev-dependencies reach. Before that bump it reached both shipped binaries
# (digest 0.11 through sha1 <- nanocode-audio, which nanocode has since dropped),
# so the >=0.4.4 floor stays the mitigation should a path come back.
# crypto-bigint links into no shipped binary: its one normal path
# (commonware-cryptography <- commonware-runtime) ends at the kata-test-seeded
# library, which only dev-dependencies reach (kata-api, kata-transport,
# kata-workflow and kata-test-utils), so a workspace build compiles it but no
# shipped binary links it. The advisory check covers dev-dependencies too).
# yanked stays a warning: the commonware git-pinned deps have no crates.io
# yank signal to react to, so hard-denying yanked would just be noise.
yanked = "warn"
# Each ignore below is a triaged advisory that no change to THIS repository's
# manifests or lockfile can clear: either no patched release exists, or the patch
# exists but a dependency kata pins (and cannot edit) requires a version range that
# excludes it. Each reason names why the flaw is unreachable from kata and the
# upstream event that re-opens it; do not add here without both.
ignore = [
    # Unsound, but no patched rand is released yet, and the trigger is narrow:
    # UB only when a custom logger emits at trace (or warn) level AND getrandom
    # simultaneously fails to reseed. kata installs no logger that re-enters
    # rand on the getrandom-failure path. Fix tracked in rust-random/rand#1763.
    { id = "RUSTSEC-2026-0097", reason = "rand unsound only under a re-entrant logger + getrandom seed failure; not reachable in kata. No fixed rand released (rust-random/rand#1763); re-evaluate on next rand release." },
    # Unmaintained-only transitives (no vulnerability). Each has a single deep
    # parent and no first-party fix short of a risky core-dep major bump.
    { id = "RUSTSEC-2024-0388", reason = "derivative (unmaintained) is pulled only by starlark 0.13; clearing needs a starlark major bump of the DSL core, unjustified for an unmaintained-only advisory. Re-evaluate when starlark drops derivative." },
    { id = "RUSTSEC-2025-0057", reason = "fxhash (unmaintained) is pulled only by starlark_map 0.13 (via starlark); same starlark-bump gate as RUSTSEC-2024-0388." },
    { id = "RUSTSEC-2024-0384", reason = "instant (unmaintained) is pulled only by notify 7 (notify-types); notify 8/9 is a major/RC bump not worth taking for an unmaintained time shim. Re-evaluate when notify stabilizes past 7." },
    { id = "RUSTSEC-2024-0436", reason = "paste (unmaintained) is pulled only by the git-pinned commonware-codec, which still depends on it at the v2026.9.0 pin; not removable without a commonware release that drops it. Re-evaluate at the next commonware pin bump." },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "MPL-2.0",
    "Zlib",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "warn"
# The git-pinned deps (commonware, nanocode) bring their own transitive dep closure
# (separate from crates.io-resolved versions elsewhere in the tree);
# `multiple-versions = "warn"` (not deny) absorbs the resulting
# duplicate-version noise without gating the build on it. Revisit if the
# duplicate count grows enough to warrant a `skip` list.
allow = []
deny = []
skip = []

[sources]
unknown-registry = "warn"
# The two git sources, commonware and nanocode, are each pinned by commit hash in
# Cargo.toml.
unknown-git = "allow"
