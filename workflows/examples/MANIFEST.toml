# ── The `kata init` starter subset (key is `starters`, PLURAL — see header) ──
#
# All three are model-free (`agent = "shell"` / approval-only), so a freshly
# `kata init`ed project stays exercisable end to end with zero model budget:
# one minimal, one loop, one human-in-the-loop.

[[starters]]
file = "hello-workflow.star"

[[starters]]
file = "gate-fix-loop.star"

[[starters]]
file = "human-gate-approval.star"
