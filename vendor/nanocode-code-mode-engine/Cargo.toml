[package]
name = "nanocode-code-mode-engine"
version = "0.7.0"
edition = "2024"
rust-version = "1.97"
publish = true
license = "MIT OR Apache-2.0"
repository = "https://github.com/nanocodexyz/nanocode"
description = "JavaScript cell execution for Code Mode on native and WASM hosts"
autotests = false
autobenches = false

[dependencies]
nanocode-platform = { version = "0.7.0", git = "https://github.com/nanocodexyz/nanocode", rev = "8ec3b215ed9280219956b4cea9edcd871fd541fb" }
nanocode-sync = { version = "0.7.0", git = "https://github.com/nanocodexyz/nanocode", rev = "8ec3b215ed9280219956b4cea9edcd871fd541fb" }
nanocode-sys = { version = "0.7.0", git = "https://github.com/nanocodexyz/nanocode", rev = "8ec3b215ed9280219956b4cea9edcd871fd541fb" }
nanocode-tool-contracts = { version = "0.7.0", git = "https://github.com/nanocodexyz/nanocode", rev = "8ec3b215ed9280219956b4cea9edcd871fd541fb" }
djs-embed = { git = "https://github.com/nanocodexyz/nanocode", rev = "8ec3b215ed9280219956b4cea9edcd871fd541fb" }
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = { version = "1.0.149", features = ["float_roundtrip", "raw_value"] }
nanocode-digest = { version = "0.7.0", git = "https://github.com/nanocodexyz/nanocode", rev = "8ec3b215ed9280219956b4cea9edcd871fd541fb" }
nanocode-trace = { version = "0.7.0", git = "https://github.com/nanocodexyz/nanocode", rev = "8ec3b215ed9280219956b4cea9edcd871fd541fb" }

[build-dependencies]
djs-embed = { git = "https://github.com/nanocodexyz/nanocode", rev = "8ec3b215ed9280219956b4cea9edcd871fd541fb" }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
nanocode-executor = { version = "0.7.0", git = "https://github.com/nanocodexyz/nanocode", rev = "8ec3b215ed9280219956b4cea9edcd871fd541fb" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
missing_const_for_fn = "warn"
use_self = "warn"
redundant_clone = "warn"
large_enum_variant = "allow"
result_large_err = "allow"
double_must_use = "allow"

[lib]
test = false
doctest = false
bench = false
